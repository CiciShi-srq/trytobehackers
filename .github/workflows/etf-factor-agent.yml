name: ETF factor agent checks
on:
  push:
    paths: ['quant/etf-factor-agent/**', '.github/workflows/etf-factor-agent.yml']
  pull_request:
    paths: ['quant/etf-factor-agent/**', '.github/workflows/etf-factor-agent.yml']
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quant/etf-factor-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python agent.py demo --out results/demo
