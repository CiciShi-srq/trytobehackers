name: Aurum gold research tests
on:
  push:
    paths: ['quant/aurum-gold-agent/**', '.github/workflows/aurum-gold-agent.yml']
  pull_request:
    paths: ['quant/aurum-gold-agent/**', '.github/workflows/aurum-gold-agent.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quant/aurum-gold-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/app.js
      - run: node --test tests/engine.test.cjs
